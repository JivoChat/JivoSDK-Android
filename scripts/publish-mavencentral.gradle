mavenPublishing {    publishToMavenCentral()    coordinates("com.jivosite.sdk", "jivo-sdk-android", "2.6.0")    pom {        name = "JivoSDK-Android"        description = "JivoSDK-Android you can integrate the chat widget for customer support into your native app."        inceptionYear = "2021"        url = "https://github.com/JivoChat/JivoSDK-Android"        licenses {            license {                name = "The Apache License, Version 2.0"                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"                distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"            }        }        developers {            developer {                id = "shibelev-jivo"                name = "Alexandr Shibelev"                url = "https://github.com/shibelev-jivo"            }            developer {                id = "tavtorkin-jivo"                name = "Alexander Tavtorkin"                url = "https://github.com/tavtorkin-jivo"            }        }        scm {            url = "https://github.com/JivoChat/JivoSDK-Android"            connection = "scm:git:github.com/JivoChat/JivoSDK-Android.git"            developerConnection = "scm:git:ssh://github.com/JivoChat/JivoSDK-Android.git"        }    }}